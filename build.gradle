buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.baseline-error-prone:gradle-baseline-error-prone:0.10.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.75.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.26.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.35.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.18.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.3.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.13.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:5.0.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.8.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.89.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.31.0'
        classpath 'org.revapi:gradle-revapi:1.8.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-error-prone-root'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.jdks'
apply plugin: 'org.revapi.revapi-gradle-plugin'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
    group 'com.palantir.refreshable'
    version System.env.CIRCLE_TAG ?: gitVersion()

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }
}

subprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'java-library'

    tasks.withType(JavaCompile) {
        options.compilerArgs += ['-Werror']
    }

    plugins.withId('com.palantir.baseline-error-prone', {
        dependencies {
            errorprone 'com.uber.nullaway:nullaway'
        }
        tasks.withType(JavaCompile).configureEach {
            options.errorprone.option('NullAway:AnnotatedPackages', 'com.palantir')
        }
    })
}

javaVersions {
    javaCompiler = 25
    libraryTarget = 17
    runtime = 25
}

jdks {
    daemonTarget = 21
}

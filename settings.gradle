buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.75.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'refreshable-root'

include 'refreshable'
include 'refreshable-benchmarks'

boolean isCiServer = System.getenv().containsKey('CI')
buildCache {
    local {
        enabled = !isCiServer
    }
}
